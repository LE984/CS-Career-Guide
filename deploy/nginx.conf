worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:8080;
    client_max_body_size 20m;

    location = /api/ai/llm/chat/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /api { return 308 /api/; }

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The legacy company service is optional. A deployment that supplies it
    # can replace this response with an upstream proxy.
    location = /company-api {
        default_type application/json;
        return 503 '{"detail":"company service is not configured"}';
    }

    location /company-api/ {
        default_type application/json;
        return 503 '{"detail":"company service is not configured"}';
    }

    location /static/ {
        alias /var/www/backend-static/;
        try_files $uri =404;
    }

    location /media/ {
        alias /var/www/media/;
        try_files $uri =404;
    }

    location / {
        proxy_pass $frontend$request_uri;
        proxy_set_header Host $host;
    }

}

}
