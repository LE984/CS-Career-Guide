server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # API and uploaded files belong to the deployment gateway/backend.
    location = /api { return 404; }
    location /api/ { return 404; }
    location /static/ { return 404; }
    location /media/ { return 404; }
    location = /company-api { return 503; }
    location /company-api/ { return 503; }
    location / { try_files $uri $uri/ /index.html; }
}
