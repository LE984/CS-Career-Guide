name: Split delivery maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only inventory or first frontend/gateway cutover
        type: choice
        required: true
        default: audit
        options: [audit, install]
      frontend_image:
        description: Exact published frontend repository digest (install only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cs-career-guide-server-env
  cancel-in-progress: false

jobs:
  audit:
    name: Verified deployment maintenance
    if: github.repository == 'vacontinuejatotired/CS-Career-Guide' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect or install over verified SSH
        env:
          ACTION: ${{ inputs.action || 'audit' }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_ENV_PATH: ${{ secrets.DEPLOY_ENV_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          python -m pip install PyYAML
          python3 ci/server_maintenance.py --action "$ACTION" --frontend-image "$FRONTEND_IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: split-deployment-${{ inputs.action || 'audit' }}-${{ github.run_id }}
          path: output/server-maintenance/*.json
          retention-days: 7
